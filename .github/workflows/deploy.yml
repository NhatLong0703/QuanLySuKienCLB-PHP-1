name: Deploy to InfinityFree FTP

on:
  push:
    branches:
      - main
      - master # Hỗ trợ cả nhánh master nếu bạn dùng nhánh cũ

jobs:
  web-deploy:
    name: Upload code to FTP
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Sync files to InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        server-dir: ./htdocs/
        exclude: |
          **/.git*
          **/.git*/**
          **/.github*/**
          .env
          .env.example
          Bat_Server_Web.bat
          README.md

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký - CLB Event</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .error-msg { color: #dc3545; font-size: 13px; margin-bottom: 10px; display: none; background: #ffe6e6; padding: 8px; border-radius: 4px; border: 1px solid #ffb3b3; }
  </style>
</head>
<body>
<div class="container">
  <div class="card" style="max-width:420px; margin:60px auto;">
    <h2 style="margin-bottom:20px; text-align:center;">Đăng ký tài khoản</h2>
    
    <div id="errorMsg" class="error-msg">Vui lòng điền đầy đủ các trường bắt buộc!</div>

    <form id="regForm">
      <label>Họ và Tên <span style="color:red">*</span></label>
      <input type="text" id="full_name" placeholder="Ví dụ: Nguyễn Văn A">
      
      <label>Email <span style="color:red">*</span></label>
      <input type="email" id="email" placeholder="Ví dụ: email@domain.com">
      
      <label>Mật khẩu <span style="color:red">*</span></label>
      <input type="password" id="password" placeholder="Ít nhất 6 ký tự">
      
      <label>Số điện thoại</label>
      <input type="text" id="phone" placeholder="Không bắt buộc">
      
      <button type="submit" class="btn btn-success" style="width:100%; margin-top:8px; padding:10px; font-size:16px;">Đăng ký</button>
    </form>

    <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
    <p style="text-align:center; font-size:13px; color:#666; margin-bottom:15px;">Hoặc đăng ký nhanh bằng</p>

    <a href="/api/auth/google" class="btn" style="width:100%; background:#fff; color:#444; border:1px solid #ccc; display:block; text-align:center; text-decoration:none; margin-bottom:10px; padding:10px;">
      <img src="https://developers.google.com/identity/images/g-logo.png" style="width:18px; vertical-align:middle; margin-right:8px;" alt="Google">Đăng ký bằng Google
    </a>
    <a href="/api/auth/microsoft" class="btn" style="width:100%; background:#2f2f2f; color:#fff; border:1px solid #2f2f2f; display:block; text-align:center; text-decoration:none; margin-bottom:10px; padding:10px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 21 21" style="vertical-align:middle; margin-right:8px;"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>Đăng ký bằng Microsoft
    </a>
    <a href="/api/auth/github" class="btn" style="width:100%; background:#24292e; color:#fff; border:1px solid #24292e; display:block; text-align:center; text-decoration:none; margin-bottom:10px; padding:10px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="white" style="vertical-align:middle; margin-right:8px;"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.11.82-.26.82-.58v-2.03c-3.34.72-4.04-1.61-4.04-1.61-.54-1.37-1.33-1.74-1.33-1.74-1.08-.74.08-.72.08-.72 1.2.08 1.83 1.23 1.83 1.23 1.06 1.82 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02.01 2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.82.58C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>Đăng ký bằng GitHub
    </a>

    <p style="text-align:center; margin-top:20px; font-size:14px;"><a href="login.html" style="color:#007bff; text-decoration:none; font-weight:bold;">Đã có tài khoản? Đăng nhập ngay</a></p>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script>
document.getElementById('regForm').onsubmit = async (e) => {
  e.preventDefault();
  
  const errorMsg = document.getElementById('errorMsg');
  const fullName = document.getElementById('full_name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const phone = document.getElementById('phone').value.trim();

  // Frontend Validation
  if (!fullName || !email || !password) {
    errorMsg.innerText = 'Vui lòng điền đầy đủ Họ tên, Email và Mật khẩu!';
    errorMsg.style.display = 'block';
    return;
  }
  
  if (password.length < 6) {
    errorMsg.innerText = 'Mật khẩu phải có ít nhất 6 ký tự!';
    errorMsg.style.display = 'block';
    return;
  }

  errorMsg.style.display = 'none';

  try {
    await apiCall('/user/register', 'POST', {
      full_name: fullName,
      email: email,
      password: password,
      phone: phone
    });
    
    alert('Đăng ký tài khoản thành công! Vui lòng đăng nhập.');
    location.href = 'login.html';
  } catch (err) {
    errorMsg.innerText = 'Lỗi: ' + (err.message || 'Email đã tồn tại hoặc xảy ra lỗi.');
    errorMsg.style.display = 'block';
  }
};
</script>
</body>
</html>
